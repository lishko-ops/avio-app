  #fallback { display:none; color:#F8F4EC; font-family: sans-serif; padding: 24px; text-align:center; }

  .avio-pulse { animation: avioPulse 2.4s ease-in-out infinite; }
  @keyframes avioSheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes avioBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes avioSectionIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .avio-filter-backdrop { animation: avioBackdropIn 0.25s ease; }
  .avio-filter-section { animation: avioSectionIn 0.18s ease; }

  .avio-filter-chip:active, .avio-filter-card:active { transform: scale(0.97); }
  @keyframes avioCalFade { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes avioCardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .avio-cal-fade { animation: avioCalFade 0.28s ease; }
  .avio-card-in { animation: avioCardIn 0.22s ease backwards; }
  .avio-date-btn { transition: transform 0.12s ease; }
  .avio-date-btn:active { transform: scale(0.88); }
  .avio-fab-tap { transition: transform 0.12s ease; }
  .avio-fab-tap:active { transform: scale(0.95); }
  @keyframes avioUploadSheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .avio-upload-sheet { animation: avioUploadSheetUp 0.25s cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes avioUploadPageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .avio-upload-page { animation: avioUploadPageIn 0.22s ease; }
  .avio-rail-circle { width: 50px; height: 50px; border-radius: 50%; background: transparent; border: none; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease, background 0.2s ease; }
  .avio-rail-btn:active .avio-rail-circle { transform: scale(0.94); background: rgba(255,255,255,0.12); }
  .avio-rail-btn.share:active .avio-rail-circle { transform: scale(0.94) rotate(8deg); }
  @keyframes avioRailBounce { 0%, 100% { transform: scale(0.94); } 50% { transform: scale(1.05); } }
  .avio-rail-btn.comment:active .avio-rail-circle { animation: avioRailBounce 0.2s ease; }
  @keyframes avioLikeBurst { 0% { transform: scale(0.3); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 30% { transform: scale(0.95); opacity: 1; } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes avioSplashDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .avio-splash-dot { animation: avioSplashDot 1s ease-in-out infinite; }
  @keyframes avioAuthPageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .avio-auth-page { animation: avioAuthPageIn 0.22s cubic-bezier(0.22,1,0.36,1); }
  .avio-press { transition: transform 0.15s ease, opacity 0.15s ease; }
  .avio-press:active { transform: scale(0.97); opacity: 0.92; }
  .avio-auth-input { transition: border-color 0.15s ease, background 0.15s ease; }
  .avio-auth-input:focus { border-color: #161616 !important; background: #fff !important; }
  .avio-auth-card { transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease; }
  @keyframes avioCheckPop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .avio-check-pop { animation: avioCheckPop 0.36s cubic-bezier(0.22,1,0.36,1); }

  .avio-ring-pulse { animation: avioRingPulse 1.4s ease-out infinite; }
  .avio-pill { transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease; }

  .avio-chip-pop { animation: avioChipPop 0.22s ease; }
</style>

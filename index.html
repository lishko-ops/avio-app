<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core responsive viewport, viewport-fit=cover enables iOS safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <title>AVIO — All-in-one booking</title>
    <meta name="description" content="Discover, budget, and book services in one place." />

    <!-- Theme color for browser chrome (Android) -->
    <meta name="theme-color" content="#15121C" />

    <!-- Android / Chrome PWA -->
    <link rel="manifest" href="/avio-app/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/avio-app/favicon.png" />

    <!-- iOS home screen app support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVIO" />
    <link rel="apple-touch-icon" sizes="180x180" href="/avio-app/apple-touch-icon.png" />

    <!-- Prevent iOS auto-detecting phone numbers as links inside the app UI -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/avio-app/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
